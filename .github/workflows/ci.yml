name: Build and test independent ZFS.so
on:
  push:
    branches: [main]
  pull_request:
jobs:
  zfs-module:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Compile native ZFS analyser
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON
          cmake --build build --parallel 2
      - name: Verify actual native parser and exported SO ABI
        run: |
          ctest --test-dir build --output-on-failure
          test -f build/ZFS.so
          nm -D build/ZFS.so | grep -F 'infiltrator_filesystem_zfs_v1'
      - uses: actions/upload-artifact@v4
        with:
          name: ZFS-so
          path: build/ZFS.so
