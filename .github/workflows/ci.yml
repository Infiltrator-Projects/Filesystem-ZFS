name: Build and test independent ZFS.so
on:
  push:
    branches: [main]
  pull_request:
jobs:
  zfs-module:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Compile native ZFS analyser
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON
          cmake --build build --parallel 2
      - name: Verify actual native parser and exported SO ABI
        run: |
          ctest --test-dir build --output-on-failure
          test -f build/ZFS.so
          nm -D build/ZFS.so | grep -F 'infiltrator_filesystem_zfs_v1'
      - name: Direct install contains only independent ZFS SO and generated manual
        shell: bash
        run: |
          set -euo pipefail
          stage="$(mktemp -d)"
          trap 'rm -rf "$stage"' EXIT
          DESTDIR="$stage" cmake --install build
          test "$(find "$stage" -type f | wc -l)" -eq 2
          test -s "$stage/System/Filesystems/ZFS.so"
          test -s "$stage/System/Resources/Documentation/Filesystem-ZFS.pdf"
          test "$(head -c 5 "$stage/System/Resources/Documentation/Filesystem-ZFS.pdf")" = '%PDF-'
          cmp build/Filesystem-ZFS.pdf "$stage/System/Resources/Documentation/Filesystem-ZFS.pdf"
      - uses: actions/upload-artifact@v4
        with:
          name: ZFS-so
          path: build/ZFS.so
