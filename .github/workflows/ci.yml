name: Build and test independent ZFS.so
on:
  push:
    branches: [main]
  pull_request:
jobs:
  zfs-module:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Compile native ZFS analyser
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON
          cmake --build build --parallel 2
      - name: Verify native ZFS parser and Common V2 shared-library ABI
        run: |
          set -euo pipefail
          ctest --test-dir build --output-on-failure
          test -f build/ZFS.so
          nm -D --defined-only build/ZFS.so | grep -F 'infiltrator_filesystem_api_v2'
          # A Common V2-only binary must not export historical provider,
          # worker or fixture APIs. Keep their sources for test/migration only.
          if nm -D --defined-only build/ZFS.so | grep -E 'infiltrator_filesystem_.*_v1|ifs_zfs_(worker_main|fixture_run)|ldtm_raw_'; then
            echo 'Previous ABI or fixture service leaked into production ZFS.so' >&2
            exit 1
          fi
          if readelf -Ws build/ZFS.so | grep -E 'infiltrator_filesystem_zfs_v1|ifs_zfs_fixture_run'; then
            echo 'Legacy symbols retained in the shipping ZFS.so' >&2
            exit 1
          fi
      - name: Exercise independent OpenZFS labels through the actual Common V2 module
        run: bash tests/openzfs-labels.sh build/zfs-v2-media build/ZFS.so
      - name: Direct install contains only independent ZFS SO and generated manual
        shell: bash
        run: |
          set -euo pipefail
          stage="$(mktemp -d)"
          trap 'rm -rf "$stage"' EXIT
          DESTDIR="$stage" cmake --install build
          test "$(find "$stage" -type f | wc -l)" -eq 2
          test -s "$stage/System/Filesystems/ZFS.so"
          test -s "$stage/System/Resources/Documentation/Filesystem-ZFS.pdf"
          test "$(head -c 5 "$stage/System/Resources/Documentation/Filesystem-ZFS.pdf")" = '%PDF-'
          cmp build/Filesystem-ZFS.pdf "$stage/System/Resources/Documentation/Filesystem-ZFS.pdf"
      - uses: actions/upload-artifact@v4
        with:
          name: ZFS-so
          path: build/ZFS.so
