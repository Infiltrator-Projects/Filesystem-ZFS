# SPDX-License-Identifier: GPL-3.0-or-later
# ZFS V2 is currently only a hosted and firmware pool probe; never publish
# it as a boot-capable filesystem without native MOS/dataset/file reads and
# production BOOT validator + OVMF kernel/initramfs qualification.
name: Qualify hosted and freestanding ZFS V2 pool probes
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: zfs-v2-release-${{ github.ref }}
  cancel-in-progress: true
jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install source build prerequisites
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends build-essential binutils cmake git pkg-config libssl-dev libsqlite3-dev dpkg-dev zfsutils-linux
      - name: Build and test Common V2 package
        run: |
          set -euo pipefail
          python3 standalone/release.py release
          bootstrap="$(find dist -maxdepth 1 -type f -name '*.run' -print -quit)"
          test -s "$bootstrap"
          test "$(wc -c < "$bootstrap")" -lt 8192
          if grep -aF '__IFS_SOURCE_PAYLOAD_BELOW__' "$bootstrap"; then exit 1; fi
          grep -F "$GITHUB_SHA" "$bootstrap"
          python3 standalone/check-package.py dist/*.deb --profile portable
          test "$(find dist -maxdepth 1 -name '*.deb' | wc -l)" = 1
          test "$(find dist -maxdepth 1 -name '*.run' | wc -l)" = 1
          test "$(find dist -maxdepth 1 -name '*.ko' | wc -l)" = 0
          mkdir -p "$RUNNER_TEMP/installed"
          dpkg-deb -x dist/*.deb "$RUNNER_TEMP/installed"
          test "$(find "$RUNNER_TEMP/installed" -type f | wc -l)" = 2
          bash tests/check_v2_exports.sh "$RUNNER_TEMP/installed/System/Filesystems/ZFS.so"
      - name: Qualify native source RUN and V2-only library
        run: |
          set -euo pipefail
          runfile="$(find dist -maxdepth 1 -name '*.run' -print -quit)"
          bash "$runfile" --profile aggressive --system-package-mode --build-only --output "$RUNNER_TEMP/native"
          deb="$(find "$RUNNER_TEMP/native" -maxdepth 1 -name '*.deb' -print -quit)"
          test -s "$deb"
          python3 standalone/check-package.py "$deb" --profile aggressive
          mkdir -p "$RUNNER_TEMP/native-root"
          dpkg-deb -x "$deb" "$RUNNER_TEMP/native-root"
          test "$(find "$RUNNER_TEMP/native-root" -type f | wc -l)" = 2
          bash tests/check_v2_exports.sh "$RUNNER_TEMP/native-root/System/Filesystems/ZFS.so"
      - name: Probe valid, damaged and relocated OpenZFS labels through both packaged modules
        run: |
          set -euo pipefail
          cmake -S . -B build/qualification -DBUILD_TESTING=ON
          cmake --build build/qualification --target zfs-v2-media zfs-mos-test zfs-format-test
          dpkg-deb -x dist/*.deb "$RUNNER_TEMP/zfs-portable"
          export ZFS_MOS_TEST="$(realpath build/qualification/zfs-mos-test)"
          bash tests/openzfs-labels.sh build/qualification/zfs-v2-media \
            "$RUNNER_TEMP/zfs-portable/System/Filesystems/ZFS.so" \
            "$RUNNER_TEMP/native-root/System/Filesystems/ZFS.so"
          for root in "$RUNNER_TEMP/zfs-portable" "$RUNNER_TEMP/native-root"; do
            sh tests/format-media.sh build/qualification/zfs-format-test "$root/System/Filesystems/ZFS.so" "$(command -v zdb)"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: ZFS-Common-V2-pool-probe
          path: dist/*
          if-no-files-found: error
  publish:
    needs: qualify
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ZFS-Common-V2-pool-probe
          path: dist
      - name: Publish immutable ZFS Common V2-only pool probe
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$(git ls-remote origin refs/heads/main | cut -f1)"
          version=$(cat VERSION)
          tag="v$version"
          test "$(find dist -maxdepth 1 -type f -name '*.deb' | wc -l)" = 1
          test "$(find dist -maxdepth 1 -type f -name '*.run' | wc -l)" = 1
          test "$(find dist -maxdepth 1 -type f | wc -l)" = 2
          test "$(find dist -type f -name '*.ko' | wc -l)" = 0
          mkdir -p build/release-check
          dpkg-deb -x dist/*.deb build/release-check
          test "$(find build/release-check -type f | wc -l)" = 2
          test -s build/release-check/System/Filesystems/ZFS.so
          test -s build/release-check/System/Resources/Documentation/Filesystem-ZFS.pdf
          bash tests/check_v2_exports.sh build/release-check/System/Filesystems/ZFS.so
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Immutable $tag already exists; no replacement."
            exit 0
          fi
          sha256sum dist/*.deb dist/*.run
          gh release create "$tag" dist/*.deb dist/*.run \
            --target "$GITHUB_SHA" --title "ZFS Common V2 pool probe $version" \
            --notes "One Common V2-only ZFS.so and PDF, native source RUN and portable DEB. Hosted native legacy single-device pool creation qualified by OpenZFS zdb; hosted/freestanding label and pool geometry probing. No ZFS dataset/file namespace, no BOOT compatibility claim, no filesystem-specific kernel driver."
